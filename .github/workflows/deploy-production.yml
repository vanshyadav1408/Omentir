name: Deploy Production

# Runs only for commits that reach main, plus manual dispatch. Neither trigger
# is reachable by a fork or an outside contributor: pushing to main and
# dispatching a workflow both require write access to this repository.
#
# Deploy secrets live in the `production` GitHub Environment, not at repository
# level, so only the `deploy` job below can read them. The environment is
# restricted to the main branch, and GitHub never exposes secrets to workflows
# triggered by pull requests from forks.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omentir-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit --pretty false
      - run: bun run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          APP_COMMIT_SHA: ${{ github.sha }}
          APP_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for required in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [ -z "${!required}" ]; then
              echo "Missing required secret: $required" >&2
              exit 1
            fi
          done

          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/omentir_vps
          chmod 600 ~/.ssh/omentir_vps

          # Prefer a pinned host key so the runner cannot be tricked into
          # trusting an impostor host. Fall back to a scan if none is set.
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "VPS_KNOWN_HOSTS is not set; falling back to ssh-keyscan." >&2
            ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/omentir_vps -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "APP_COMMIT_SHA=$APP_COMMIT_SHA APP_REPOSITORY=$APP_REPOSITORY bash -s" <<'REMOTE'
          set -euo pipefail

          app_dir="$HOME/omentir"
          backup_dir="$(mktemp -d "$HOME/omentir-deploy-backup.XXXXXX")"
          had_build=0

          if [ -d "$app_dir/.next" ]; then
            cp -a "$app_dir/.next" "$backup_dir/.next"
            had_build=1
          fi

          restore_build() {
            if [ "$app_dir" != "$HOME/omentir" ]; then
              echo "Refusing to restore an unexpected application directory: $app_dir" >&2
              return 1
            fi
            rm -rf "$app_dir/.next"
            cp -a "$backup_dir/.next" "$app_dir/.next"
          }

          cleanup() {
            status=$?
            trap - EXIT

            if [ "$status" -ne 0 ] && [ "$had_build" -eq 1 ]; then
              echo "Deployment failed. Restoring the last complete Next.js build." >&2
              restore_build
              pm2 restart omentir --update-env
              pm2 save
            fi

            rm -rf "$backup_dir"
            exit "$status"
          }
          trap cleanup EXIT

          set +e
          bash "$HOME/scripts/deploy-omentir.sh"
          deploy_status=$?
          set -e

          if [ "$deploy_status" -ne 0 ] && [ "$had_build" -eq 1 ]; then
            echo "Deployment build failed. Retrying once with the application stopped." >&2
            restore_build
            pm2 stop omentir

            set +e
            bash "$HOME/scripts/deploy-omentir.sh"
            deploy_status=$?
            set -e
          fi

          exit "$deploy_status"
          REMOTE

          homepage="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 https://omentir.com/)"
          mapfile -t chunks < <(
            printf '%s' "$homepage" |
              grep -oE 'src="/_next/static/chunks/[^"]+\.js"' |
              sed -E 's/^src="(.*)"$/\1/' |
              sort -u
          )

          if [ "${#chunks[@]}" -eq 0 ]; then
            echo "No JavaScript chunks found in the production homepage." >&2
            exit 1
          fi

          for chunk in "${chunks[@]}"; do
            content_type="$(
              curl --fail --silent --show-error --retry 5 --retry-delay 2 \
                --output /dev/null --write-out '%{content_type}' \
                "https://omentir.com$chunk"
            )"
            if [[ "$content_type" != application/javascript* ]]; then
              echo "Unexpected content type for $chunk: $content_type" >&2
              exit 1
            fi
          done
