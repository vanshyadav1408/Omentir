name: Deploy Production

# Runs only for commits that reach main, plus manual dispatch. Neither trigger
# is reachable by a fork or an outside contributor: pushing to main and
# dispatching a workflow both require write access to this repository.
#
# Deploy secrets live in the `production` GitHub Environment, not at repository
# level, so only the `deploy` job below can read them. The environment is
# restricted to the main branch, and GitHub never exposes secrets to workflows
# triggered by pull requests from forks.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omentir-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit --pretty false
      - run: bun run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          APP_COMMIT_SHA: ${{ github.sha }}
          APP_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for required in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [ -z "${!required}" ]; then
              echo "Missing required secret: $required" >&2
              exit 1
            fi
          done

          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/omentir_vps
          chmod 600 ~/.ssh/omentir_vps

          # Prefer a pinned host key so the runner cannot be tricked into
          # trusting an impostor host. Fall back to a scan if none is set.
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "VPS_KNOWN_HOSTS is not set; falling back to ssh-keyscan." >&2
            ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/omentir_vps -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "APP_COMMIT_SHA=$APP_COMMIT_SHA APP_REPOSITORY=$APP_REPOSITORY bash ~/scripts/deploy-omentir.sh"

          if ! homepage="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 https://omentir.com/)"
          then
            echo "Production homepage did not become healthy after deployment." >&2
            exit 1
          fi
          mapfile -t assets < <(
            printf '%s' "$homepage" |
              grep -oE '(src|href)="/_next/static/chunks/[^"]+\.(js|css)"' |
              sed -E 's/^(src|href)="(.*)"$/\2/' |
              sort -u
          )

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No JavaScript or CSS chunks found in the production homepage." >&2
            exit 1
          fi

          for asset in "${assets[@]}"; do
            case "$asset" in
              *.js) expected_content_type="application/javascript" ;;
              *.css) expected_content_type="text/css" ;;
              *) echo "Unexpected asset type: $asset" >&2; exit 1 ;;
            esac
            if ! content_type="$(
              curl --fail --silent --show-error --retry 5 --retry-delay 2 \
                --output /dev/null --write-out '%{content_type}' \
                "https://omentir.com$asset"
            )"
            then
              echo "Production asset failed to load: $asset" >&2
              exit 1
            fi
            if [[ "$content_type" != "$expected_content_type"* ]]; then
              echo "Unexpected content type for $asset: $content_type" >&2
              exit 1
            fi
          done

      - name: Notify IndexNow
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET

          def fetch(url, data=None, headers=None, timeout=60):
              request = urllib.request.Request(url, data=data, headers=headers or {})
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return response.status, response.read()

          key = fetch("https://omentir.com/indexnow-key.txt")[1].decode().strip()
          spec_path = f"https://omentir.com/{key}.txt"
          spec_body = fetch(spec_path)[1].decode().strip()
          if spec_body != key:
              raise SystemExit(f"IndexNow spec path {spec_path} did not return the key")

          xml = fetch("https://omentir.com/sitemap.xml")[1]
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = []
          for loc in ET.fromstring(xml).findall(".//sm:loc", ns):
              url = (loc.text or "").strip()
              path = url[len("https://omentir.com"):] if url.startswith("https://omentir.com") else url
              if url and not path.endswith((".md", ".txt", ".json")):
                  urls.append(url)
          if not urls:
              raise SystemExit("sitemap.xml contained no HTML URLs")

          payload = json.dumps({
              "host": "omentir.com",
              "key": key,
              "keyLocation": spec_path,
              "urlList": urls,
          }).encode()
          headers = {"content-type": "application/json; charset=utf-8"}
          ok = False
          for endpoint in ("https://api.indexnow.org/indexnow", "https://www.bing.com/indexnow"):
              try:
                  status, body = fetch(endpoint, data=payload, headers=headers)
                  print(f"{endpoint} -> {status} {body[:200]!r}")
                  ok = ok or status in (200, 202)
              except Exception as error:
                  print(f"{endpoint} failed: {error}")
          if not ok:
              raise SystemExit("IndexNow rejected the post-deploy ping")
          print(f"IndexNow accepted {len(urls)} HTML URLs")
          PY
